<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open SmartPaper</title>
<style>
  :root{--paper:#FBFAF7;--ink:#1C1B19;--ink2:#6E6A62;--violet:#6354D6;--line:#EFEBE3}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,system-ui,'Segoe UI',sans-serif;background:var(--paper);color:var(--ink);
    text-align:center;padding:56px 20px;line-height:1.55}
  .card{max-width:420px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px 24px}
  img{width:88px;height:88px}
  h1{font-size:22px;margin:14px 0 6px}
  p{color:var(--ink2);font-size:15px;margin:0 0 20px}
  .btn{display:block;text-decoration:none;font-weight:700;font-size:16px;padding:14px;border-radius:13px;margin:10px 0}
  .ios{background:var(--ink);color:#fff}
  .and{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
  .open{background:var(--violet);color:#fff}
  small{display:block;color:#9ca3af;font-size:12.5px;margin-top:16px}
</style>
</head>
<body>
  <div class="card">
    <img src="https://nzeladoubwjtcgnddmim.supabase.co/storage/v1/object/public/question-images/email/smarty.png" alt="Smarty">
    <h1>Opening SmartPaper…</h1>
    <p>If the app doesn't open automatically, tap below.</p>
    <a class="btn open" href="smartpaper://home">Open the app</a>
    <a class="btn ios" href="https://apps.apple.com/app/smartpaper-ai/id6761371880">Download on the App Store</a>
    <a class="btn and" href="https://play.google.com/store/apps/details?id=com.smartpaper.app">Get it on Google Play</a>
    <small>Having trouble? Email sagarjilka@gmail.com</small>
  </div>
<script>
  // Try to deep-link straight into the app; the buttons stay as a fallback.
  setTimeout(function(){ try{ window.location.href = 'smartpaper://home'; }catch(e){} }, 300);
</script>
</body>
</html>
